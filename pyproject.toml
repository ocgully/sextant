[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant"
version = "0.1.0"
description = "Semantic-operation diff classifier. Reads diffs as operations (rename, extract, move, reformat, ...), not line deltas. Phase 1A: classifier + CLI + git-context + standalone risk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Christopher Gulliver" }]
keywords = ["sextant", "diff", "semantic-diff", "refactoring", "tree-sitter", "ast", "git", "classifier"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Libraries",
]

# Core requires tree-sitter. Language grammars are extras.
dependencies = [
  "tree-sitter>=0.21",
]

[project.optional-dependencies]
python   = ["tree-sitter-python>=0.21"]
ts       = ["tree-sitter-typescript>=0.21", "tree-sitter-javascript>=0.21"]
rust     = ["tree-sitter-rust>=0.21"]
go       = ["tree-sitter-go>=0.21"]
markdown = ["tree-sitter-markdown>=0.21"]
all = [
  "tree-sitter-python>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-go>=0.21",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ocgully/sextant"
Repository = "https://github.com/ocgully/sextant"
Issues = "https://github.com/ocgully/sextant/issues"

[project.scripts]
sextant = "sextant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sextant*"]

[tool.setuptools.package-data]
sextant = ["gui/*.md", "conflict/*.md", "llm/*.md"]
