[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsextant"
version = "0.6.0"
description = "Semantic-operation diff classifier. Reads diffs as operations (rename, extract, move, reformat, ...), not line deltas. Phase 1B-1E: git diff/merge driver, web GUI, conflict tooling, LLM residual + agent-session integration (no API key)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Christopher Gulliver" }]
keywords = ["diffsextant", "sextant", "diff", "semantic-diff", "refactoring", "tree-sitter", "ast", "git", "classifier"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Libraries",
]

# Core requires tree-sitter. Language grammars are extras.
dependencies = [
  "tree-sitter>=0.21",
]

[project.optional-dependencies]
python   = ["tree-sitter-python>=0.21"]
ts       = ["tree-sitter-typescript>=0.21", "tree-sitter-javascript>=0.21"]
rust     = ["tree-sitter-rust>=0.21"]
go       = ["tree-sitter-go>=0.21"]
markdown = ["tree-sitter-markdown>=0.21"]
all = [
  "tree-sitter-python>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-go>=0.21",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ocgully/diffsextant"
Repository = "https://github.com/ocgully/diffsextant"
Issues = "https://github.com/ocgully/diffsextant/issues"

[project.scripts]
# New primary entry point.
diffsextant = "diffsextant.cli:main"
# Deprecation shim — prints a stderr warning and forwards to `main`.
# Scheduled for removal in v2.0 (kept for two minor cycles).
sextant = "diffsextant.cli:main_deprecated_alias"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffsextant*"]

[tool.setuptools.package-data]
diffsextant = [
  "gui/*.md",
  "conflict/*.md",
  "llm/*.md",
  "web/static/*.html",
  "web/static/*.js",
  "web/static/*.css",
]
